name: Build, test and release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: Publish pre-release v<project version> from this commit
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  # Partition table and file system probe tests against images made by the
  # real Linux tools (sfdisk, sgdisk, mkfs.*, blkid).
  linux-tests:
    name: Unit tests (Linux, reference images)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ fdisk gdisk dosfstools e2fsprogs ntfs-3g \
            exfatprogs btrfs-progs xfsprogs f2fs-tools cryptsetup-bin

      - name: Create reference images
        run: sh tests/make_test_images.sh "$RUNNER_TEMP/images"

      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DWPARTED_BUILD_GUI=OFF -DWPARTED_WERROR=ON \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          cmake --build build

      - name: Unit tests
        env:
          WPARTED_TEST_IMAGES: ${{ runner.temp }}/images
        run: ./build/wparted_unit_tests

      - name: Upload reference images
        uses: actions/upload-artifact@v4
        with:
          name: reference-images
          path: ${{ runner.temp }}/images
          retention-days: 3

  windows:
    name: Build and test (Windows, MSYS2 UCRT64)
    needs: linux-tests
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-gtkmm3
            mingw-w64-ucrt-x86_64-adwaita-icon-theme
            mingw-w64-ucrt-x86_64-librsvg
            mingw-w64-ucrt-x86_64-gettext-tools
            mingw-w64-ucrt-x86_64-gtk-update-icon-cache

      - name: Version
        id: version
        run: |
          version=$(sed -n 's/^[[:space:]]*VERSION \([0-9.]*\)$/\1/p' CMakeLists.txt | head -n 1)
          echo "Version $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/v* && "${GITHUB_REF#refs/tags/v}" != "$version" ]]; then
            echo "::error::Tag $GITHUB_REF does not match project version $version"
            exit 1
          fi

      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DWPARTED_WERROR=ON
          cmake --build build

      - uses: actions/download-artifact@v4
        with:
          name: reference-images
          path: images

      - name: Unit tests
        run: WPARTED_TEST_IMAGES="$PWD/images" ./build/wparted_unit_tests.exe

      # Real partition table and file system operations through the Windows
      # storage stack, on a throw away virtual disk only.
      - name: Integration tests on a virtual disk
        shell: pwsh
        run: |
          $vhd = Join-Path $env:RUNNER_TEMP "wparted-test.vhdx"
          "create vdisk file=`"$vhd`" maximum=2048 type=expandable`nselect vdisk file=`"$vhd`"`nattach vdisk" |
            Set-Content -Encoding ascii "$env:RUNNER_TEMP\attach.txt"
          diskpart /s "$env:RUNNER_TEMP\attach.txt"
          if ($LASTEXITCODE -ne 0) { throw "diskpart failed" }
          try {
            $disk = (Get-DiskImage -ImagePath $vhd | Get-Disk).Number
            Write-Host "Virtual test disk: $disk"
            $env:WPARTED_TEST_VHD_DISK = "$disk"
            & .\build\wparted_win_tests.exe
            if ($LASTEXITCODE -ne 0) { throw "integration tests failed" }
          } finally {
            "select vdisk file=`"$vhd`"`ndetach vdisk" | Set-Content -Encoding ascii "$env:RUNNER_TEMP\detach.txt"
            diskpart /s "$env:RUNNER_TEMP\detach.txt"
          }

      - name: Bundle
        run: scripts/bundle-windows.sh build dist/WParted

      # Read only scan of the runner's real disks plus a short display of the
      # main window from the bundle, checking the GTK runtime is complete.
      - name: Smoke test
        shell: pwsh
        timeout-minutes: 5
        run: |
          $bin = (Resolve-Path dist\WParted\bin).Path
          $out = Join-Path $env:RUNNER_TEMP "smoke-out.txt"
          $err = Join-Path $env:RUNNER_TEMP "smoke-err.txt"
          $p = Start-Process -FilePath (Join-Path $bin "wparted.exe") -ArgumentList "--smoke-test" `
                 -WorkingDirectory $env:RUNNER_TEMP -NoNewWindow -Wait -PassThru `
                 -RedirectStandardOutput $out -RedirectStandardError $err
          Get-Content $out
          Get-Content $err
          if ($p.ExitCode -ne 0) { throw "smoke test failed with exit code $($p.ExitCode)" }
          if (-not (Select-String -Path $out -Pattern "main window shown and closed" -Quiet)) {
            throw "main window did not show"
          }

      - name: Portable zip
        shell: pwsh
        run: |
          Compress-Archive -Path dist\WParted -DestinationPath "dist\WParted-${{ steps.version.outputs.version }}-win64-portable.zip"

      - name: Installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
          }
          & $iscc "/DMyAppVersion=${{ steps.version.outputs.version }}" installer\wparted.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }

      - name: Checksums
        shell: pwsh
        run: |
          Get-ChildItem dist\*.zip, dist\*.exe | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content -Encoding ascii dist\SHA256SUMS.txt
          Get-Content dist\SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: WParted-win64
          path: |
            dist/*.zip
            dist/*.exe
            dist/SHA256SUMS.txt

  release:
    name: Publish pre-release
    needs: windows
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: WParted-win64
          path: dist

      # The 1.0.0-preview release was built from the earlier, unsafe code base
      # that this version replaces; do not leave it downloadable.
      - name: Remove retired releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for tag in v1.0.0-preview; do
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
              gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
            elif git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
              git push origin --delete "refs/tags/$tag"
            fi
          done

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.windows.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: WParted v${{ needs.windows.outputs.version }}
          prerelease: true
          files: |
            dist/*.zip
            dist/*.exe
            dist/SHA256SUMS.txt
          body: |
            WParted v${{ needs.windows.outputs.version }}: first pre-release of the Windows port of GParted.

            **Pre-release software for partitioning disks: back up your data first.**

            * Installer: `WParted-*-win64-setup.exe`. Portable: `WParted-*-win64-portable.zip` (run `bin\wparted.exe`).
            * Windows 10 or 11, 64 bit; runs as administrator.
            * If you installed 1.0.0-preview, uninstall it first (Settings, Apps); that preview was built from a different, unsafe code base and has been withdrawn.
            * See the [README](https://github.com/AA-EION/WParted#readme) for what is supported on Windows.
